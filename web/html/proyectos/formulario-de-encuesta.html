<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <!-- Water CSS: hay modo light y dark -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
</head>
<body>
    <!--
    -->
<h1 id="title">Formulario de Encuesta</h1>

<p id="description">Completa este formulario para conocer tu opinión sobre nuestra página web.</p>

<form id="survey-form">
    
    <label id="name-label">Nombre:</label>
    <input id="name" type="text" placeholder="John Doe" required>

    <br>

    <label id="email-label">Email:</label>
    <input id="email" type="email" required>
    
    <br>
    
    <label id="number-label">Edad:</label>
    <input id="number" type="number" min="18" max="99">
    
    <br>
    
    <label for="">Select:</label>
    <select name="" id="">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
    </select>
    
    <label for="">textarea</label>
    <textarea name="" id="">esto es un campo de texto</textarea>
    <!-- Submit -->
    <input type="button" value="Enviar">
</form>

</body>
</html>
