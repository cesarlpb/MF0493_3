<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Book Inventory</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Book Inventory</h1>
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Status</th>
        <th>Rate</th>
      </tr>
    </thead>
    <tbody>
      <tr class="read">
        <td>Project Hail Mary</td>
        <td>Andy Weir</td>
        <td>Sci-Fi</td>
        <td><span class="status">Read</span></td>
        <td>
          <span class="rate three"><span></span><span></span><span></span></span>
        </td>
      </tr>
      <tr class="to-read">
        <td>Thinking, Fast and Slow</td>
        <td>Daniel Kahneman</td>
        <td>Psychology</td>
        <td><span class="status">To Read</span></td>
        <td>
          <span class="rate"><span></span><span></span><span></span></span>
        </td>
      </tr>
      <tr class="in-progress">
        <td>The Psychology of Money</td>
        <td>Morgan Housel</td>
        <td>Finance</td>
        <td><span class="status">In Progress</span></td>
        <td>
          <span class="rate"><span></span><span></span><span></span></span>
        </td>
      </tr>
      <tr class="read">
        <td>Refactoring</td>
        <td>Martin Fowler</td>
        <td>Programming</td>
        <td><span class="status">Read</span></td>
        <td>
          <span class="rate two"><span></span><span></span><span></span></span>
        </td>
      </tr>
      <tr class="read">
        <td>Deep Work</td>
        <td>Cal Newport</td>
        <td>Focus</td>
        <td><span class="status">Read</span></td>
        <td>
          <span class="rate one"><span></span><span></span><span></span></span>
        </td>
      </tr>
    </tbody>
  </table>
</body>

</html>
